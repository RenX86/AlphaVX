[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphavx"
version = "0.0.3"
description = "AlphaGenome Variant Effect Interpreter — batch-score VCF variants and generate multi-modal effect reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "RenX86"},
]
keywords = ["bioinformatics", "genomics", "variant-interpretation", "alphagenome", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "alphagenome>=0.6.1",
    "typer[all]>=0.9.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
alphavx = "alphavx.cli:app"

[project.urls]
Homepage = "https://github.com/RenX86/AlphaVX"
Repository = "https://github.com/RenX86/AlphaVX"
Issues = "https://github.com/RenX86/AlphaVX/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/alphavx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
